name = "reeflive-push"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
VAPID_SUBJECT = "mailto:mexicouger@gmail.com"

# Create with: npx wrangler kv namespace create QUEUE   (paste the id it prints below)
[[kv_namespaces]]
binding = "QUEUE"
id = "REPLACE_WITH_KV_ID"

# Secrets (set with `npx wrangler secret put NAME`, never committed): VAPID_PUBLIC, VAPID_PRIVATE_JWK
