name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  # Never cancel a main build: each one publishes a Release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships an Android SDK; this pins the exact platform/build-tools and accepts licenses.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # versionCode grows with every run so each APK installs as an upgrade (same applicationId + committed key).
      # The in-app updater reads "versionCode: N" from the release body (fallback: tag run number + 100).
      - name: Version
        id: ver
        run: |
          name="0.1.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      # Room writes app/schemas as a side effect of KSP, which Gradle does not track as an output. On branch
      # runs (read-only cache) KSP can be restored FROM-CACHE without writing the schema, failing
      # DatabaseUpgradeSafetyTest. Force KSP to run so the exported schema always exists.
      - name: App unit tests
        run: ./gradlew :app:kspDebugKotlin --rerun && ./gradlew :app:testDebugUnitTest -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }} --stacktrace

      - name: Annotate unit test failures
        if: failure()
        run: |
          grep -rh -A3 "<failure" app/build/test-results core/build/test-results 2>/dev/null | head -c 1500 | tr '\n' ' ' | sed 's/^/::error::/' || true

      - name: Build APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease \
            -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }} --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/reeflive.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/reeflive-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reeflive-apks-${{ steps.ver.outputs.tag }}
          path: |
            dist/reeflive.apk
            dist/reeflive-debug.apk
            app/schemas/
          if-no-files-found: error

      - name: Release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ReefLive ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            versionCode: ${{ steps.ver.outputs.code }}

            Install `reeflive.apk` (or update from inside the app: Settings → Updates). It installs over the previous version and keeps your data.
          generate_release_notes: true
          make_latest: true
          files: |
            dist/reeflive.apk
            dist/reeflive-debug.apk
