name: Core tests

# The Android app is no longer built or published; the browser app is the product. The :core sim test suite still
# runs on every push and pull request (the job keeps the name "build" so existing required checks keep matching).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # -PcoreOnly skips the Android SDK, so only :core (the sim, AI and chemistry) is compiled and tested.
      - name: Core unit tests
        run: ./gradlew -PcoreOnly :core:test --stacktrace

      - name: Annotate unit test failures
        if: failure()
        run: |
          grep -rh -A3 "<failure" core/build/test-results 2>/dev/null | head -c 1500 | tr '\n' ' ' | sed 's/^/::error::/' || true
