name: Core tests

# The Android app is no longer built or published; the browser app is the product. The :core sim test suite still
# runs on every push and pull request. It runs as SHARDS parallel jobs ("shard"), each running its share of the tests
# in FORKS JVMs (core/build.gradle.kts packs the tests by the measured seconds in core/test-weights.txt). The "build" job
# (the name existing required checks match) waits for every shard, is green only if all of them passed, and prints the
# test count and the slowest tests. SimBenchmark is not part of this run: see bench.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # keep matrix.shard below at 0..SHARDS-1. FORKS: JVMs per shard; a runner's 4 vCPUs are 2 cores with
  # hyper-threading: 2 JVMs per runner did the suite in 93 min of test time, 4 JVMs in 170 (c20: 10 vs 12 min).
  SHARDS: 6
  FORKS: 2

jobs:
  shard:
    name: Core tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' || matrix.shard != 0 }}

      # -PcoreOnly skips the Android SDK, so only :core (the sim, AI and chemistry) is compiled and tested.
      # --continue: a failing bin does not stop the other bins of the shard.
      - name: Core unit tests
        run: ./gradlew -PcoreOnly -PtestShards=$SHARDS -PtestForks=$FORKS -PtestShard=${{ matrix.shard }} :core:testShard --continue --stacktrace

      - name: Annotate unit test failures
        if: failure()
        run: |
          grep -rh -A3 "<failure" core/build/test-results 2>/dev/null | head -c 1500 | tr '\n' ' ' | sed 's/^/::error::/' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results-${{ matrix.shard }}
          path: core/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: warn

  build:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: core-test-results-*
          path: results

      - name: Test summary
        run: |
          python3 .github/scripts/test_report.py results
          echo "::group::measured weights (paste into core/test-weights.txt to refresh the shard packing)"
          python3 .github/scripts/test_report.py results --weights
          echo "::endgroup::"

      - name: All shards passed
        run: |
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "::error::core test shards: ${{ needs.shard.result }}"
            exit 1
          fi
