name: Web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Safari can't play every .ogg: the build also encodes the tank sounds to .m4a with ffmpeg.
      - name: ffmpeg for the web sounds
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      # Same :core sim and app render sources as the APK, compiled to JavaScript; -PcoreOnly skips the Android SDK.
      - name: Build web app
        run: ./gradlew -PcoreOnly :web:site --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: reeflive-web
          path: web/build/site
          if-no-files-found: error

      # Published at https://<owner>.github.io/<repo>/ (Settings → Pages → source: gh-pages branch).
      # Runs on every push to main, the same pushes that publish the APK, so the web app always matches Android.
      - name: Publish to GitHub Pages (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/build/site
          force_orphan: true
          commit_message: Web app ${{ github.sha }}
