name: Sim benchmark

# SimBenchmark (#207) measures the sim's tick cost; it checks nothing and is left out of "Core tests". Run it by hand.
on:
  workflow_dispatch:
    inputs:
      ticks:
        description: Ticks per speed and round (-PbenchTicks)
        required: false
        default: '400'
      detail:
        description: Frame-time histograms (-PbenchDetail)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: SimBenchmark
        run: >
          ./gradlew -PcoreOnly -Pbench -PbenchTicks=${{ inputs.ticks }} -PbenchDetail=${{ inputs.detail }}
          :core:test --tests '*.SimBenchmark' --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-benchmark
          path: core/build/sim-benchmark*.txt
